          package com.example.sociallimiter

          import android.content.ComponentName
          import android.content.Context
          import android.content.pm.PackageManager
          import android.provider.Settings

          object Enabler {
              private fun me(c: Context) = ComponentName(c, LimiterService::class.java)

              fun isEnabled(c: Context): Boolean {
                  val s = Settings.Secure.getString(c.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: return false
                  val me = me(c)
                  return s.split(":").any { ComponentName.unflattenFromString(it) == me }
              }

              // ההרשאה ניתנת פעם אחת דרך adb
              fun canWrite(c: Context) =
                  c.checkSelfPermission(android.Manifest.permission.WRITE_SECURE_SETTINGS) == PackageManager.PERMISSION_GRANTED

              fun tryEnable(c: Context): Boolean {
                  if (!canWrite(c)) return false
                  return try {
                      val cr = c.contentResolver
                      val flat = me(c).flattenToString()
                      val cur = Settings.Secure.getString(cr, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: ""
                      val next = if (cur.isBlank()) flat else "$cur:$flat"
                      Settings.Secure.putString(cr, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES, next)
                      Settings.Secure.putString(cr, Settings.Secure.ACCESSIBILITY_ENABLED, "1")
                      true
                  } catch (e: Exception) {
                      false
                  }
              }
          }
