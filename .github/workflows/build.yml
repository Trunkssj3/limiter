              private val refresh = object : Runnable {
                  override fun run() { update(); handler.postDelayed(this, 1000) }
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(24), dp(40), dp(24), dp(24))
                      layoutDirection = View.LAYOUT_DIRECTION_RTL
                  }
                  fun text(size: Float) = TextView(this).apply { textSize = size; gravity = Gravity.START }

                  root.addView(text(24f).apply { text = "מגביל רשתות חברתיות" })
                  root.addView(text(14f).apply {
                      text = "LinkedIn · Instagram · Facebook — אפליקציות ואתרים בדפדפן, זמן משותף"
                      setPadding(0, dp(4), 0, dp(24))
                  })

                  used = text(20f); root.addView(used)
                  bar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply { max = 100 }
                  root.addView(bar, LinearLayout.LayoutParams(-1, dp(16)).apply { topMargin = dp(8); bottomMargin = dp(24) })

                  root.addView(text(16f).apply { text = "מגבלה יומית (דקות):" })
                  input = EditText(this).apply {
                      inputType = InputType.TYPE_CLASS_NUMBER
                      setText(Store.limitMinutes(this@MainActivity).toString())
                  }
                  root.addView(input)
                  saveBtn = Button(this).apply {
                      text = "שמור"
                      setOnClickListener { save() }
                  }
                  root.addView(saveBtn)
                  msg = text(13f).apply { setTextColor(Color.RED) }
                  root.addView(msg)

                  status = text(16f).apply { setPadding(0, dp(32), 0, dp(8)) }
                  root.addView(status)
                  root.addView(Button(this).apply {
                      text = "פתח הגדרות נגישות"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  })

                  auto = text(14f).apply { setPadding(0, dp(24), 0, dp(4)) }
                  root.addView(auto)
                  adbHint = text(12f).apply {
                      setTextIsSelectable(true)
                      text = "להפעלה אוטומטית מלאה, חבר למחשב והרץ פעם אחת:\nadb shell pm grant com.example.sociallimiter android.permission.WRITE_SECURE_SETTINGS"
                  }
                  root.addView(adbHint)

                  setContentView(ScrollView(this).apply { addView(root) })

                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }
                  GuardService.start(this)
              }

              private fun save() {
                  if (Store.limitLocked(this)) return
                  val v = input.text.toString().toIntOrNull() ?: return
                  if (v < 1 || v > 600) return
                  AlertDialog.Builder(this)
                      .setTitle("לנעול את המגבלה?")
                      .setMessage("המגבלה תהיה $v דקות, ולא ניתן יהיה לשנות אותה עד מחר.")
                      .setPositiveButton("אישור") { _, _ -> Store.setLimitMinutes(this, v); update() }
                      .setNegativeButton("ביטול", null)
                      .show()
              }

              private fun update() {
                  val secs = Store.usedSeconds(this)
                  val limit = Store.limitMinutes(this)
                  used.text = "%d:%02d מתוך %d:00 דקות".format(secs / 60, secs % 60, limit)
                  bar.progress = minOf(100, secs * 100 / (limit * 60))

                  val locked = Store.limitLocked(this)
                  input.isEnabled = !locked
                  saveBtn.isEnabled = !locked
                  if (locked) {
                      if (input.text.toString() != limit.toString()) input.setText(limit.toString())
                      msg.text = "🔒 המגבלה נעולה להיום. אפשר לשנות אותה מחר."
                  } else {
                      msg.text = ""
                  }

                  val beat = Store.lastBeat(this)
                  val ago = (System.currentTimeMillis() - beat) / 1000
                  status.text = when {
                      beat > 0 && ago < 5 -> "✅ השירות פעיל"
                      Enabler.isEnabled(this) -> "⏳ השירות מופעל, מתחבר..."
                      else -> "⚠️ השירות כבוי — הפעל אותו בהגדרות נגישות"
                  }

                  val canWrite = Enabler.canWrite(this)
                  auto.text = if (canWrite) "🔁 הפעלה אוטומטית מחדש: פעילה"
                  else "🔁 הפעלה אוטומטית מחדש: לא הוגדרה. אם השירות ייכבה תקבל התראה, ולחיצה עליה תפתח את ההגדרות."
                  adbHint.visibility = if (canWrite) View.GONE else View.VISIBLE
              }

              override fun onResume() { super.onResume(); handler.post(refresh) }
              override fun onPause() { handler.removeCallbacks(refresh); super.onPause() }
          }
