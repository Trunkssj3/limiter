          package com.example.sociallimiter

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.provider.Settings
          import android.widget.Toast

          object Notifier {
              const val CH_ONGOING = "ongoing"
              const val CH_ALERT = "alerts"

              fun createChannels(c: Context) {
                  val nm = c.getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel(CH_ONGOING, "פועל ברקע", NotificationManager.IMPORTANCE_MIN))
                  nm.createNotificationChannel(NotificationChannel(CH_ALERT, "התראות", NotificationManager.IMPORTANCE_HIGH))
              }

              fun ongoing(c: Context): Notification =
                  Notification.Builder(c, CH_ONGOING)
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setContentTitle("מגביל רשתות פעיל")
                      .setOngoing(true)
                      .build()

              fun warn(c: Context) {
                  val msg = "זמן שימוש ברשתות עומד להסתיים בעוד 2 דקות"
                  createChannels(c)
                  val n = Notification.Builder(c, CH_ALERT)
                      .setSmallIcon(android.R.drawable.stat_sys_warning)
                      .setContentTitle("מגביל רשתות")
                      .setContentText(msg)
                      .setAutoCancel(true)
                      .build()
                  c.getSystemService(NotificationManager::class.java).notify(3, n)
                  Toast.makeText(c, msg, Toast.LENGTH_LONG).show()
              }

              // נשלחת כשהשירות כבוי ואי אפשר להפעיל אותו מחדש אוטומטית
              fun off(c: Context) {
                  createChannels(c)
                  val pi = PendingIntent.getActivity(
                      c, 0, Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val n = Notification.Builder(c, CH_ALERT)
                      .setSmallIcon(android.R.drawable.stat_sys_warning)
                      .setContentTitle("מגביל רשתות כבוי")
                      .setContentText("לחץ כדי להפעיל אותו מחדש בהגדרות נגישות")
                      .setContentIntent(pi)
                      .setAutoCancel(true)
                      .build()
                  c.getSystemService(NotificationManager::class.java).notify(2, n)
              }
          }
