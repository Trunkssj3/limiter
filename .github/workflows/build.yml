          cat > app/src/main/java/com/example/sociallimiter/Store.kt <<'SLEOF'
          package com.example.sociallimiter

          import android.content.Context
          import java.time.LocalDate

          object Store {
              // החבילות שנספרות יחד
              val TARGETS = setOf(
                  "com.linkedin.android",
                  "com.instagram.android",
                  "com.facebook.katana",
                  "com.instagram.lite",
                  "com.facebook.lite"
              )

              private fun p(c: Context) = c.getSharedPreferences("limiter", Context.MODE_PRIVATE)
              private fun today() = LocalDate.now().toString()

              fun limitMinutes(c: Context) = p(c).getInt("limit", 30)

              // שמירת מגבלה נועלת אותה עד סוף היום
              fun setLimitMinutes(c: Context, v: Int) =
                  p(c).edit().putInt("limit", v).putString("limit_date", today()).apply()

              fun limitLocked(c: Context) = p(c).getString("limit_date", "") == today()

              fun usedSeconds(c: Context): Int =
                  if (p(c).getString("date", "") == today()) p(c).getInt("secs", 0) else 0

              fun addSecond(c: Context) {
                  val s = usedSeconds(c) + 1
                  p(c).edit().putString("date", today()).putInt("secs", s).apply()
              }

              fun isOver(c: Context) = usedSeconds(c) >= limitMinutes(c) * 60

              // התראה "2 דקות לסיום" - פעם אחת ביום
              fun warnedToday(c: Context) = p(c).getString("warn_date", "") == today()
              fun setWarned(c: Context) = p(c).edit().putString("warn_date", today()).apply()

              // "דופק" של השירות
              fun beat(c: Context) = p(c).edit().putLong("beat", System.currentTimeMillis()).apply()
              fun lastBeat(c: Context) = p(c).getLong("beat", 0L)
          }
