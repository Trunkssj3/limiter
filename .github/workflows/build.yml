name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write project files
        run: |
          mkdir -p app
          cat > app/build.gradle.kts <<'SLEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.sociallimiter"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.sociallimiter"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          SLEOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'SLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="מגביל רשתות"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.Light">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".LimiterService"
                      android:exported="false"
                      android:label="מגביל רשתות"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          SLEOF
          mkdir -p app/src/main/java/com/example/sociallimiter
          cat > app/src/main/java/com/example/sociallimiter/LimiterService.kt <<'SLEOF'
          package com.example.sociallimiter

          import android.accessibilityservice.AccessibilityService
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Toast
          import java.util.ArrayDeque

          class LimiterService : AccessibilityService() {

              companion object {
                  // דפדפנים מוכרים. אפשר להוסיף חבילות נוספות לרשימה.
                  val BROWSERS = setOf(
                      "com.android.chrome", "com.chrome.beta", "com.chrome.dev", "com.chrome.canary",
                      "com.sec.android.app.sbrowser", "org.mozilla.firefox", "org.mozilla.firefox_beta",
                      "org.mozilla.fenix", "com.microsoft.emmx", "com.brave.browser", "com.opera.browser",
                      "com.opera.mini.native", "com.duckduckgo.mobile.android", "com.vivaldi.browser",
                      "com.kiwibrowser.browser", "com.mi.globalbrowser", "com.android.browser", "com.huawei.browser"
                  )
                  private val SITE = Regex("""(^|[/.@])(linkedin|instagram|facebook)\.com([/:?#]|\z)""")
                  private val URL_IDS = listOf(
                      "url_bar", "url_field", "location_bar_edit_text",
                      "mozac_browser_toolbar_url_view", "omnibarTextInput", "url_bar_title"
                  )
              }

              private val handler = Handler(Looper.getMainLooper())

              // זוכר את המצב האחרון כשסרגל הכתובת מוסתר בזמן גלילה
              private var stickyPkg: String? = null
              private var stickyOnSite = false

              private val tick = object : Runnable {
                  override fun run() {
                      check()
                      handler.postDelayed(this, 1000)
                  }
              }

              private fun nodeText(n: AccessibilityNodeInfo?): String? =
                  n?.text?.toString()?.lowercase()?.trim()?.takeIf { it.isNotEmpty() }

              private fun findUrlText(root: AccessibilityNodeInfo, pkg: String): String? {
                  for (name in URL_IDS) {
                      val nodes = root.findAccessibilityNodeInfosByViewId("$pkg:id/$name").orEmpty()
                      for (n in nodes) {
                          val t = nodeText(n)
                          if (t != null) return t
                      }
                  }
                  // גיבוי: סריקה מוגבלת של העץ אחרי סרגל כתובת
                  val q = ArrayDeque<AccessibilityNodeInfo>()
                  q.add(root)
                  var seen = 0
                  while (q.isNotEmpty() && seen < 300) {
                      val n = q.poll() ?: break
                      seen++
                      val id = n.viewIdResourceName?.lowercase() ?: ""
                      if (id.contains("url") || id.contains("location_bar") || id.contains("address") || id.contains("omnibar")) {
                          val t = nodeText(n)
                          if (t != null) return t
                      }
                      for (i in 0 until n.childCount) {
                          n.getChild(i)?.let { q.add(it) }
                      }
                  }
                  return null
              }

              // האם כרגע על המסך אפליקציית רשת חברתית, או דפדפן שפתוח באחד האתרים
              private fun onTarget(): Boolean {
                  val root = rootInActiveWindow ?: return false
                  val pkg = root.packageName?.toString() ?: return false
                  if (pkg in Store.TARGETS) return true
                  if (pkg !in BROWSERS) {
                      stickyPkg = null
                      stickyOnSite = false
                      return false
                  }
                  if (stickyPkg != pkg) {
                      stickyPkg = pkg
                      stickyOnSite = false
                  }
                  val url = findUrlText(root, pkg)
                  if (url != null) stickyOnSite = SITE.containsMatchIn(url)
                  return stickyOnSite
              }

              private fun check() {
                  val pm = getSystemService(PowerManager::class.java)
                  if (!pm.isInteractive) return                       // המסך כבוי - לא סופרים
                  if (!onTarget()) return

                  if (Store.isOver(this)) {
                      performGlobalAction(GLOBAL_ACTION_HOME)
                      Toast.makeText(this, "נגמר הזמן להיום ברשתות החברתיות", Toast.LENGTH_LONG).show()
                  } else {
                      Store.addSecond(this)
                  }
              }

              override fun onServiceConnected() {
                  handler.removeCallbacks(tick)
                  handler.post(tick)
              }

              // חסימה מיידית בכניסה, כדי שלא יהיה חלון זמן קצר של גישה
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event?.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED &&
                      Store.isOver(this) && onTarget()
                  ) {
                      performGlobalAction(GLOBAL_ACTION_HOME)
                  }
              }

              override fun onInterrupt() {}

              override fun onDestroy() {
                  handler.removeCallbacks(tick)
                  super.onDestroy()
              }
          }
          SLEOF
          mkdir -p app/src/main/java/com/example/sociallimiter
          cat > app/src/main/java/com/example/sociallimiter/MainActivity.kt <<'SLEOF'
          package com.example.sociallimiter

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.widget.*

          class MainActivity : Activity() {

              private lateinit var status: TextView
              private lateinit var used: TextView
              private lateinit var bar: ProgressBar
              private lateinit var input: EditText
              private lateinit var msg: TextView
              private val handler = Handler(Looper.getMainLooper())
              private val refresh = object : Runnable {
                  override fun run() { update(); handler.postDelayed(this, 1000) }
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(24), dp(40), dp(24), dp(24))
                      layoutDirection = View.LAYOUT_DIRECTION_RTL
                  }
                  fun text(size: Float) = TextView(this).apply { textSize = size; gravity = Gravity.START }

                  root.addView(text(24f).apply { text = "מגביל רשתות חברתיות" })
                  root.addView(text(14f).apply { text = "LinkedIn · Instagram · Facebook — אפליקציות ואתרים בדפדפן, זמן משותף"; setPadding(0, dp(4), 0, dp(24)) })

                  used = text(20f); root.addView(used)
                  bar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply { max = 100 }
                  root.addView(bar, LinearLayout.LayoutParams(-1, dp(16)).apply { topMargin = dp(8); bottomMargin = dp(24) })

                  root.addView(text(16f).apply { text = "מגבלה יומית (דקות):" })
                  input = EditText(this).apply { inputType = InputType.TYPE_CLASS_NUMBER; setText(Store.limitMinutes(this@MainActivity).toString()) }
                  root.addView(input)
                  root.addView(Button(this).apply {
                      text = "שמור"
                      setOnClickListener { save() }
                  })
                  msg = text(13f).apply { setTextColor(Color.RED) }
                  root.addView(msg)

                  status = text(16f).apply { setPadding(0, dp(32), 0, dp(8)) }
                  root.addView(status)
                  root.addView(Button(this).apply {
                      text = "פתח הגדרות נגישות"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  })

                  setContentView(ScrollView(this).apply { addView(root) })
              }

              private fun save() {
                  val v = input.text.toString().toIntOrNull() ?: return
                  if (v < 1) return
                  val cur = Store.limitMinutes(this)
                  // אחרי שהזמן נגמר אי אפשר להגדיל את המגבלה באותו יום
                  if (v > cur && Store.isOver(this)) {
                      msg.text = "אי אפשר להגדיל מגבלה אחרי שהזמן נגמר 🙂"
                      return
                  }
                  Store.setLimitMinutes(this, v)
                  msg.text = ""
                  update()
              }

              private fun serviceEnabled(): Boolean {
                  val s = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: return false
                  return s.contains("$packageName/${LimiterService::class.java.name}")
              }

              private fun update() {
                  val secs = Store.usedSeconds(this)
                  val limit = Store.limitMinutes(this)
                  used.text = "%d:%02d מתוך %d:00 דקות".format(secs / 60, secs % 60, limit)
                  bar.progress = minOf(100, secs * 100 / (limit * 60))
                  status.text = if (serviceEnabled()) "✅ השירות פעיל" else "⚠️ השירות כבוי — הפעל אותו בהגדרות נגישות"
              }

              override fun onResume() { super.onResume(); handler.post(refresh) }
              override fun onPause() { handler.removeCallbacks(refresh); super.onPause() }
          }
          SLEOF
          mkdir -p app/src/main/java/com/example/sociallimiter
          cat > app/src/main/java/com/example/sociallimiter/Store.kt <<'SLEOF'
          package com.example.sociallimiter

          import android.content.Context
          import java.time.LocalDate

          object Store {
              // החבילות שנספרות יחד
              val TARGETS = setOf(
                  "com.linkedin.android",
                  "com.instagram.android",
                  "com.facebook.katana",
                  "com.instagram.lite",
                  "com.facebook.lite"
              )

              private fun p(c: Context) = c.getSharedPreferences("limiter", Context.MODE_PRIVATE)
              private fun today() = LocalDate.now().toString()

              fun limitMinutes(c: Context) = p(c).getInt("limit", 30)
              fun setLimitMinutes(c: Context, v: Int) = p(c).edit().putInt("limit", v).apply()

              fun usedSeconds(c: Context): Int =
                  if (p(c).getString("date", "") == today()) p(c).getInt("secs", 0) else 0

              fun addSecond(c: Context) {
                  val s = usedSeconds(c) + 1
                  p(c).edit().putString("date", today()).putInt("secs", s).apply()
              }

              fun isOver(c: Context) = usedSeconds(c) >= limitMinutes(c) * 60
          }
          SLEOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'SLEOF'
          <resources>
              <string name="service_desc">בודק איזו אפליקציה פתוחה כדי לספור זמן ברשתות חברתיות ולחסום אחרי המגבלה היומית. לא נאסף ולא נשלח שום מידע.</string>
          </resources>
          SLEOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_config.xml <<'SLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100"
              android:description="@string/service_desc" />
          SLEOF
          cat > build.gradle.kts <<'SLEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          SLEOF
          cat > gradle.properties <<'SLEOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          SLEOF
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties <<'SLEOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          SLEOF
          cat > settings.gradle.kts <<'SLEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "SocialLimiter"
          include(":app")
          SLEOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          gradle assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SocialLimiter.apk
          gh release create "v${{ github.run_number }}" SocialLimiter.apk --repo "${{ github.repository }}" --title "Social Limiter ${{ github.run_number }}" --notes "APK להתקנה"
