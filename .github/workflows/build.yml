          package com.example.sociallimiter

          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.database.ContentObserver
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.provider.Settings

          // שירות רקע שמשגיח על שירות הנגישות ומפעיל אותו מחדש אם כובה
          class GuardService : Service() {

              companion object {
                  fun start(c: Context) {
                      try {
                          c.startForegroundService(Intent(c, GuardService::class.java))
                      } catch (e: Exception) {
                          // המערכת לא מרשה להתחיל כרגע; ננסה שוב בפעם הבאה
                      }
                  }
              }

              private val handler = Handler(Looper.getMainLooper())
              private var observer: ContentObserver? = null
              private var lastTry = 0L

              private val periodic = object : Runnable {
                  override fun run() {
                      ensure()
                      handler.postDelayed(this, 30_000)
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  Notifier.createChannels(this)
                  startForeground(1, Notifier.ongoing(this))

                  val obs = object : ContentObserver(handler) {
                      override fun onChange(selfChange: Boolean) {
                          handler.postDelayed({ ensure() }, 1500)
                      }
                  }
                  observer = obs
                  contentResolver.registerContentObserver(
                      Settings.Secure.getUriFor(Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES), false, obs
                  )
                  handler.post(periodic)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int = START_STICKY

              private fun ensure() {
                  try {
                      val nm = getSystemService(NotificationManager::class.java)
                      if (Enabler.isEnabled(this)) {
                          nm.cancel(2)
                          return
                      }
                      val now = System.currentTimeMillis()
                      if (Enabler.canWrite(this)) {
                          if (now - lastTry > 5000) {
                              lastTry = now
                              Enabler.tryEnable(this)
                          }
                      } else {
                          Notifier.off(this)
                      }
                  } catch (e: Exception) {
                      // לא מפילים את השירות
                  }
              }

              override fun onDestroy() {
                  handler.removeCallbacks(periodic)
                  observer?.let { contentResolver.unregisterContentObserver(it) }
                  super.onDestroy()
              }
          }
