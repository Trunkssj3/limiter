          package com.example.sociallimiter

          import android.accessibilityservice.AccessibilityService
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Toast
          import java.util.ArrayDeque

          class LimiterService : AccessibilityService() {

              companion object {
                  // דפדפנים מוכרים. אפשר להוסיף חבילות נוספות לרשימה.
                  val BROWSERS = setOf(
                      "com.android.chrome", "com.chrome.beta", "com.chrome.dev", "com.chrome.canary",
                      "com.sec.android.app.sbrowser", "org.mozilla.firefox", "org.mozilla.firefox_beta",
                      "org.mozilla.fenix", "com.microsoft.emmx", "com.brave.browser", "com.opera.browser",
                      "com.opera.mini.native", "com.duckduckgo.mobile.android", "com.vivaldi.browser",
                      "com.kiwibrowser.browser", "com.mi.globalbrowser", "com.android.browser", "com.huawei.browser"
                  )
                  private val SITE = Regex("""(^|[/.@])(linkedin|instagram|facebook)\.com([/:?#]|\z)""")
                  private val URL_IDS = listOf(
                      "url_bar", "url_field", "location_bar_edit_text",
                      "mozac_browser_toolbar_url_view", "omnibarTextInput", "url_bar_title"
                  )
              }

              private val handler = Handler(Looper.getMainLooper())

              // זוכר את המצב האחרון כשסרגל הכתובת מוסתר בזמן גלילה
              private var stickyPkg: String? = null
              private var stickyOnSite = false

              private val tick = object : Runnable {
                  override fun run() {
                      Store.beat(this@LimiterService)
                      try {
                          doCheck()
                      } catch (e: Exception) {
                          // לא מפילים את השירות
                      }
                      handler.postDelayed(this, 1000)
                  }
              }

              private fun nodeText(n: AccessibilityNodeInfo?): String? =
                  n?.text?.toString()?.lowercase()?.trim()?.takeIf { it.isNotEmpty() }

              private fun findUrlText(root: AccessibilityNodeInfo, pkg: String): String? {
                  for (name in URL_IDS) {
                      val nodes = root.findAccessibilityNodeInfosByViewId("$pkg:id/$name").orEmpty()
                      for (n in nodes) {
                          val t = nodeText(n)
                          if (t != null) return t
                      }
                  }
                  // גיבוי: סריקה מוגבלת של העץ אחרי סרגל כתובת
                  val q = ArrayDeque<AccessibilityNodeInfo>()
                  q.add(root)
                  var seen = 0
                  while (q.isNotEmpty() && seen < 300) {
                      val n = q.poll() ?: break
                      seen++
                      val id = n.viewIdResourceName?.lowercase() ?: ""
                      if (id.contains("url") || id.contains("location_bar") || id.contains("address") || id.contains("omnibar")) {
                          val t = nodeText(n)
                          if (t != null) return t
                      }
                      for (i in 0 until n.childCount) {
                          n.getChild(i)?.let { q.add(it) }
                      }
                  }
                  return null
              }

              // האם כרגע על המסך אפליקציית רשת חברתית, או דפדפן שפתוח באחד האתרים
              private fun onTarget(): Boolean {
                  val root = rootInActiveWindow ?: return false
                  val pkg = root.packageName?.toString() ?: return false
                  if (pkg in Store.TARGETS) return true
                  if (pkg !in BROWSERS) {
                      stickyPkg = null
                      stickyOnSite = false
                      return false
                  }
                  if (stickyPkg != pkg) {
                      stickyPkg = pkg
                      stickyOnSite = false
                  }
                  val url = findUrlText(root, pkg)
                  if (url != null) stickyOnSite = SITE.containsMatchIn(url)
                  return stickyOnSite
              }

              private fun maybeWarn() {
                  val warnAt = Store.limitMinutes(this) * 60 - 120
                  if (warnAt > 0 && Store.usedSeconds(this) >= warnAt && !Store.warnedToday(this)) {
                      Store.setWarned(this)
                      Notifier.warn(this)
                  }
              }

              private fun doCheck() {
                  val pm = getSystemService(PowerManager::class.java)
                  if (!pm.isInteractive) return                       // המסך כבוי - לא סופרים
                  if (!onTarget()) return

                  if (Store.isOver(this)) {
                      performGlobalAction(GLOBAL_ACTION_HOME)
                      Toast.makeText(this, "נגמר הזמן להיום ברשתות החברתיות", Toast.LENGTH_LONG).show()
                  } else {
                      Store.addSecond(this)
                      maybeWarn()
                  }
              }

              override fun onServiceConnected() {
                  GuardService.start(this)
                  handler.removeCallbacks(tick)
                  handler.post(tick)
              }

              // חסימה מיידית בכניסה, כדי שלא יהיה חלון זמן קצר של גישה
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  try {
                      if (event?.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED &&
                          Store.isOver(this) && onTarget()
                      ) {
                          performGlobalAction(GLOBAL_ACTION_HOME)
                      }
                  } catch (e: Exception) {
                      // לא מפילים את השירות
                  }
              }

              override fun onInterrupt() {}

              override fun onDestroy() {
                  handler.removeCallbacks(tick)
                  super.onDestroy()
              }
          }
